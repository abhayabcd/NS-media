<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlgoForge — DSA Mastery Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --border: #252a35;
    --accent: #00e5a0;
    --accent2: #3b82f6;
    --accent3: #f59e0b;
    --danger: #ef4444;
    --text: #e8eaf0;
    --muted: #6b7280;
    --font-mono: 'Space Mono', monospace;
    --font-sans: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.5;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-sans);
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: -0.5px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: #000;
    font-family: var(--font-mono);
  }

  .logo span { color: var(--accent); }

  nav { display: flex; gap: 4px; }

  nav button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  nav button:hover { color: var(--text); background: var(--surface2); }
  nav button.active { color: var(--accent); background: rgba(0,229,160,0.08); }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .streak-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.3);
    color: var(--accent3);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    font-family: var(--font-mono);
  }

  /* MAIN LAYOUT */
  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 65px);
  }

  /* SIDEBAR */
  aside {
    border-right: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
    padding: 20px 0;
  }

  .sidebar-section { margin-bottom: 24px; }

  .sidebar-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 20px;
    margin-bottom: 8px;
  }

  .topic-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
    font-size: 0.88rem;
    font-weight: 600;
  }

  .topic-item:hover { background: var(--surface2); color: var(--text); }
  .topic-item.active { background: rgba(0,229,160,0.06); border-left-color: var(--accent); color: var(--accent); }

  .topic-count {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--muted);
    background: var(--surface2);
    padding: 2px 7px;
    border-radius: 10px;
  }

  .topic-item.active .topic-count { background: rgba(0,229,160,0.15); color: var(--accent); }

  .progress-ring-wrap {
    padding: 16px 20px;
  }

  .progress-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }

  .progress-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }

  .progress-bar-wrap {
    background: var(--border);
    border-radius: 4px;
    height: 6px;
    margin-bottom: 6px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 1s ease;
  }

  .progress-nums {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    font-family: var(--font-mono);
    color: var(--muted);
  }

  /* MAIN CONTENT */
  main {
    overflow-y: auto;
    background: var(--bg);
  }

  /* VIEWS */
  .view { display: none; padding: 28px 32px; }
  .view.active { display: block; }

  /* PROBLEM LIST VIEW */
  .view-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .view-title {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .view-title span { color: var(--accent); }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .search-box {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 0.85rem;
    padding: 9px 14px;
    border-radius: 8px;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--muted); }

  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 0.82rem;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn:hover { background: #00ffb0; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,229,160,0.05); transform: none; }

  .btn-sm { padding: 6px 12px; font-size: 0.78rem; }

  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.active { background: rgba(0,229,160,0.1); border-color: var(--accent); color: var(--accent); }
  .filter-chip.easy { --fc: #22c55e; }
  .filter-chip.medium { --fc: var(--accent3); }
  .filter-chip.hard { --fc: var(--danger); }
  .filter-chip.easy.active { background: rgba(34,197,94,0.1); border-color: #22c55e; color: #22c55e; }
  .filter-chip.medium.active { background: rgba(245,158,11,0.1); border-color: var(--accent3); color: var(--accent3); }
  .filter-chip.hard.active { background: rgba(239,68,68,0.1); border-color: var(--danger); color: var(--danger); }

  /* PROBLEM TABLE */
  .problem-table { width: 100%; border-collapse: collapse; }

  .problem-table th {
    text-align: left;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }

  .problem-row {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
    cursor: pointer;
  }

  .problem-row:hover { background: var(--surface); }

  .problem-row td { padding: 14px; font-size: 0.88rem; }

  .problem-name { font-weight: 600; color: var(--text); }
  .problem-name:hover { color: var(--accent); }

  .diff-badge {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 4px;
    font-family: var(--font-mono);
  }

  .diff-easy { background: rgba(34,197,94,0.12); color: #22c55e; }
  .diff-medium { background: rgba(245,158,11,0.12); color: var(--accent3); }
  .diff-hard { background: rgba(239,68,68,0.12); color: var(--danger); }

  .status-icon { font-size: 1rem; }

  .topic-tag {
    font-size: 0.7rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--font-mono);
  }

  /* PROBLEM DETAIL VIEW */
  .problem-detail {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    height: calc(100vh - 65px);
  }

  .problem-panel {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 28px;
  }

  .editor-panel { display: flex; flex-direction: column; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 20px;
    transition: color 0.15s;
    background: none;
    border: none;
    font-family: var(--font-sans);
  }

  .back-btn:hover { color: var(--accent); }

  .problem-title {
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .problem-desc {
    font-size: 0.9rem;
    line-height: 1.75;
    color: #c8cad0;
    margin-bottom: 20px;
  }

  .problem-desc p { margin-bottom: 12px; }

  .example-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .example-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .example-box code {
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: var(--accent);
    display: block;
    line-height: 1.6;
  }

  .constraint-list {
    margin: 0;
    padding-left: 0;
    list-style: none;
  }

  .constraint-list li {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--muted);
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }

  .constraint-list li::before { content: '→ '; color: var(--accent2); }

  /* EDITOR */
  .editor-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    gap: 10px;
  }

  .lang-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    outline: none;
  }

  .code-editor {
    flex: 1;
    background: #0d1117;
    border: none;
    color: #c9d1d9;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    padding: 20px;
    resize: none;
    outline: none;
    line-height: 1.7;
    tab-size: 4;
  }

  .editor-footer {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .run-result {
    flex: 1;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--muted);
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 6px;
    min-height: 36px;
    max-height: 60px;
    overflow-y: auto;
  }

  .result-pass { color: #22c55e; }
  .result-fail { color: var(--danger); }

  /* AI ASSISTANT */
  .ai-panel {
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  .ai-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    transition: color 0.15s;
  }

  .ai-toggle:hover { color: var(--text); }
  .ai-toggle.open { color: var(--accent2); }

  .ai-badge {
    font-size: 0.65rem;
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    color: var(--accent2);
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .ai-body { display: none; padding: 12px 16px; border-top: 1px solid var(--border); }
  .ai-body.open { display: block; }

  .ai-messages { max-height: 180px; overflow-y: auto; margin-bottom: 10px; }

  .ai-msg {
    margin-bottom: 10px;
    font-size: 0.82rem;
    line-height: 1.6;
  }

  .ai-msg.user { color: var(--text); font-weight: 600; }

  .ai-msg.bot {
    color: #a0aec0;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 8px;
    border-left: 3px solid var(--accent2);
  }

  .ai-msg.bot code {
    font-family: var(--font-mono);
    background: rgba(255,255,255,0.06);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.78rem;
    color: var(--accent);
  }

  .ai-input-row { display: flex; gap: 8px; }

  .ai-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 0.82rem;
    padding: 8px 12px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }

  .ai-input:focus { border-color: var(--accent2); }
  .ai-input::placeholder { color: var(--muted); }

  .ai-send-btn {
    background: var(--accent2);
    border: none;
    color: #fff;
    font-size: 0.82rem;
    font-weight: 700;
    font-family: var(--font-sans);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .ai-send-btn:hover { background: #2563eb; }
  .ai-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* DASHBOARD VIEW */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .stat-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent-c, var(--accent));
  }

  .stat-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .stat-value { font-size: 2rem; font-weight: 800; font-family: var(--font-mono); color: var(--text); }
  .stat-sub { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  .heatmap-section { margin-bottom: 28px; }
  .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; color: var(--text); }

  .heatmap {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
  }

  .hm-cell {
    width: 14px;
    height: 14px;
    border-radius: 2px;
    background: var(--border);
    transition: transform 0.1s;
    cursor: default;
  }

  .hm-cell:hover { transform: scale(1.3); }
  .hm-0 { background: var(--border); }
  .hm-1 { background: rgba(0,229,160,0.2); }
  .hm-2 { background: rgba(0,229,160,0.4); }
  .hm-3 { background: rgba(0,229,160,0.65); }
  .hm-4 { background: var(--accent); }

  .topic-mastery-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .mastery-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  .mastery-name {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .mastery-pct {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--accent);
  }

  /* LOADING */
  .loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* GENERATE VIEW */
  .gen-form {
    max-width: 640px;
    margin: 0 auto;
  }

  .form-group { margin-bottom: 20px; }

  .form-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .form-select, .form-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 0.9rem;
    padding: 11px 14px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-select:focus, .form-input:focus { border-color: var(--accent); }

  .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }

  .diff-chip {
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    background: var(--surface);
    color: var(--muted);
  }

  .diff-chip:hover { border-color: var(--muted); color: var(--text); }
  .diff-chip.selected-easy { border-color: #22c55e; background: rgba(34,197,94,0.1); color: #22c55e; }
  .diff-chip.selected-medium { border-color: var(--accent3); background: rgba(245,158,11,0.1); color: var(--accent3); }
  .diff-chip.selected-hard { border-color: var(--danger); background: rgba(239,68,68,0.1); color: var(--danger); }

  .gen-output {
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: none;
    animation: fadeIn 0.4s ease;
  }

  .gen-output.visible { display: block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .generated-title {
    font-size: 1.2rem;
    font-weight: 800;
    margin-bottom: 12px;
  }

  .generated-body {
    font-size: 0.88rem;
    line-height: 1.75;
    color: #c8cad0;
    white-space: pre-wrap;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-title { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .empty-sub { font-size: 0.85rem; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* RESPONSIVE TABLET */
  @media (max-width: 900px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .problem-detail { grid-template-columns: 1fr; }
    .editor-panel { height: 50vh; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">AF</div>
